<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MemoryScape</title>
  <meta name="description" content="Walk a memory palace. Seal facts to a path and recall them under pressure." />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Outfit:wght@380;460;560;640&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f1ea;
      --surface: #fffcf6;
      --surface-2: #ebe6dc;
      --line: #d8d2c6;
      --navy: #1e2a4a;
      --ink: #24315c;
      --muted: #5c657a;
      --faint: #8a90a0;
      --teal: #5c9496;
      --teal-deep: #3d6d78;
      --gold: #c9a46c;
      --rose: #b85c52;
      --ok: #2f7d57;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
    }
    .font-display { font-family: Fraunces, Georgia, serif; }
    button, input { font: inherit; }
    button { cursor: pointer; border: none; }
    .shell {
      position: relative;
      min-height: 100dvh;
      overflow: hidden;
    }
    .shell::before, .shell::after {
      content: "";
      position: absolute;
      width: 14rem;
      height: 18rem;
      border-radius: 50% 50% 40% 40%;
      border: 10px solid rgba(92, 148, 150, 0.12);
      pointer-events: none;
    }
    .shell::before { left: -4rem; top: 2rem; }
    .shell::after { right: -5rem; bottom: -2rem; width: 18rem; height: 22rem; }
    .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .arch {
      width: 2.4rem;
      height: 2.8rem;
      border: 3px solid var(--navy);
      border-bottom: none;
      border-radius: 999px 999px 0 0;
      position: relative;
      background: linear-gradient(180deg, #d8e8e8 0%, #f4f1ea 70%);
      flex-shrink: 0;
    }
    .arch::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 4px;
      height: 55%;
      background: var(--gold);
      transform: translateX(-50%);
      border-radius: 4px;
    }
    .wordmark { font-family: Fraunces, Georgia, serif; font-size: 1.35rem; letter-spacing: -0.02em; color: var(--navy); }
    .wordmark span { color: var(--teal); }
    .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: clamp(1.6rem, 3vw, 2.1rem); margin: 0 0 0.35rem; color: var(--navy); }
    .lede { margin: 0; color: var(--muted); max-width: 36rem; line-height: 1.5; }
    .grid {
      display: grid;
      gap: 1rem;
      margin-top: 1.25rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 840px) {
      .grid { grid-template-columns: 1.1fr 1fr 1fr; }
      .grid .form { grid-row: span 2; }
    }
    .card, .form {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      text-align: left;
      box-shadow: 0 12px 40px rgba(36, 49, 92, 0.06);
      transition: border-color 0.15s ease;
    }
    .card { padding: 0; display: flex; flex-direction: column; cursor: pointer; color: inherit; width: 100%; }
    .card:hover { border-color: var(--teal); }
    .card-art {
      height: 9rem;
      background: var(--surface-2);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0.75rem;
    }
    .card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.35rem; flex: 1; }
    .card-title { font-family: Fraunces, Georgia, serif; font-size: 1.35rem; color: var(--navy); }
    .card-sub { color: var(--muted); font-size: 0.92rem; }
    .card-meta {
      margin-top: auto;
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .card-meta .best { color: var(--teal-deep); }
    .form { padding: 1rem; display: flex; flex-direction: column; gap: 0.55rem; }
    .form label {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal-deep);
    }
    .form input {
      height: 2.5rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      padding: 0 0.75rem;
      color: var(--navy);
      outline: none;
    }
    .form input:focus { border-color: var(--teal); background: #fff; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .btn {
      height: 2.75rem;
      border-radius: 999px;
      background: var(--navy);
      color: var(--surface);
      font-weight: 560;
      letter-spacing: 0.02em;
      padding: 0 1.25rem;
    }
    .btn:hover { background: var(--teal-deep); }
    .btn.ghost {
      background: transparent;
      color: var(--navy);
      border: 1px solid var(--line);
    }
    .btn.ghost:hover { border-color: var(--teal); }
    .btn.sm { height: 2.25rem; font-size: 0.85rem; padding: 0 0.9rem; }
    .remove {
      margin-top: 0.35rem;
      background: none;
      color: var(--rose);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0;
      align-self: flex-start;
    }
    .hud {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .stats { display: flex; gap: 0.5rem; }
    .stat {
      min-width: 4.25rem;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      padding: 0.4rem 0.65rem;
    }
    .stat .l { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }
    .stat .v { font-family: Fraunces, Georgia, serif; font-size: 1.1rem; color: var(--navy); line-height: 1.1; }
    .rail {
      height: 4px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .rail > i {
      display: block;
      height: 100%;
      background: var(--gold);
      width: 0%;
      transition: width 0.25s ease;
    }
    .walk-grid {
      display: grid;
      gap: 1rem;
    }
    @media (min-width: 900px) {
      .walk-grid { grid-template-columns: 1fr 340px; }
    }
    .stage {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 22rem;
      position: relative;
    }
    .scene {
      width: min(100%, 280px);
      aspect-ratio: 360 / 460;
    }
    .scene svg { width: 100%; height: 100%; display: block; }
    .cue {
      margin-top: 0.75rem;
      text-align: center;
      color: var(--muted);
      max-width: 22rem;
      line-height: 1.45;
    }
    .panel {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .panel h2 { margin: 0; font-family: Fraunces, Georgia, serif; font-size: 1.35rem; color: var(--navy); }
    .path {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .node {
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.75rem;
      display: grid;
      place-items: center;
    }
    .node.here { background: var(--navy); color: #fff; border-color: var(--navy); }
    .node.sealed { background: #d8efe4; border-color: var(--ok); color: var(--ok); }
    .node.missed { background: #f3e0dd; border-color: var(--rose); color: var(--rose); }
    .nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .choices { display: flex; flex-direction: column; gap: 0.5rem; }
    .choice {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 0.85rem 0.95rem;
      color: var(--ink);
      line-height: 1.4;
    }
    .choice:hover:not(:disabled) { border-color: var(--teal); background: #fff; }
    .choice.correct { border-color: var(--ok); background: #e8f6ef; }
    .choice.wrong { border-color: var(--rose); background: #f8ebe9; opacity: 0.85; }
    .debrief {
      max-width: 32rem;
      margin: 3rem auto;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 2rem 1.5rem;
    }
    .debrief .score {
      font-family: Fraunces, Georgia, serif;
      font-size: 2.5rem;
      color: var(--navy);
      margin: 0.5rem 0;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="wrap" id="app"></div>
  </div>
  <script>
    const PALACES = [
      {
        id: "atrium",
        name: "The Atrium",
        subtitle: "Biology, sealed to light",
        tone: "dawn",
        loci: [
          { id: "a1", title: "Sun gate", fact: "Photosynthesis turns light, water, and CO\u2082 into glucose and oxygen.", cue: "A sun pouring gold into a glass leaf.", decoys: ["Respiration only happens at night in plants.", "Chlorophyll reflects all green light as heat.", "Stomata open only when soil is frozen."] },
          { id: "a2", title: "Vein pool", fact: "Mitochondria convert glucose and oxygen into ATP, the cell's usable energy.", cue: "A glowing coin spinning in a warm pool.", decoys: ["The nucleus stores ATP for later use.", "Ribosomes burn sugar to make heat.", "Lysosomes package energy as fat."] },
          { id: "a3", title: "Membrane arch", fact: "Cell membranes are selectively permeable phospholipid bilayers.", cue: "A gate that only lets certain shapes pass.", decoys: ["Membranes are solid protein walls.", "Every molecule crosses freely by diffusion only.", "DNA forms the outer skin of the cell."] },
          { id: "a4", title: "Code shelf", fact: "DNA stores genetic information as sequences of nucleotide bases.", cue: "Four colored beads on an endless string.", decoys: ["Proteins store the permanent genetic code.", "RNA never leaves the nucleus.", "Genes are made only of amino acids."] },
          { id: "a5", title: "Split stair", fact: "Mitosis divides one cell into two genetically identical daughter cells.", cue: "A staircase that forks into twin paths.", decoys: ["Meiosis always produces identical clones.", "Mitosis halves the chromosome number.", "Daughter cells receive random half genomes."] },
          { id: "a6", title: "Root well", fact: "Osmosis is water moving across a membrane toward higher solute concentration.", cue: "Water climbing a dark root toward salt.", decoys: ["Osmosis moves sugar, never water.", "Water always flows toward lower solute.", "Active transport is the only way water moves."] }
        ]
      },
      {
        id: "harbor",
        name: "The Harbor",
        subtitle: "A list you cannot drop",
        tone: "harbor",
        loci: [
          { id: "h1", title: "Mooring post", fact: "Spaced repetition schedules reviews just before you would forget.", cue: "A rope that tightens right before it slips.", decoys: ["Cramming once is stronger than spaced reviews.", "You should only review items you already know perfectly.", "Forgetting curves do not apply to adults."] },
          { id: "h2", title: "Lantern dock", fact: "The method of loci links information to vivid places in a mental route.", cue: "Lanterns marking rooms on a known pier.", decoys: ["Loci only works with numbers, not facts.", "You must memorize places you have never seen.", "Order does not matter in a memory palace."] },
          { id: "h3", title: "Cargo net", fact: "Working memory holds only a few items at once without rehearsal.", cue: "A net that can only lift a handful of crates.", decoys: ["Working memory has unlimited capacity.", "Long-term memory is cleared every night.", "Attention does not affect encoding."] },
          { id: "h4", title: "Tide chart", fact: "Retrieval practice strengthens memory more than rereading alone.", cue: "Pulling the chart up from dark water.", decoys: ["Highlighting is the strongest study method.", "Passive review beats active recall.", "Testing yourself only measures, never teaches."] },
          { id: "h5", title: "Fog horn", fact: "Interference rises when similar items are studied without distinctive cues.", cue: "Two ships sounding almost the same note.", decoys: ["Similar facts never compete in memory.", "Distinct images make recall harder.", "Context has no effect on retrieval."] }
        ]
      },
      {
        id: "gallery",
        name: "Night Gallery",
        subtitle: "Dates that stay put",
        tone: "night",
        loci: [
          { id: "g1", title: "Bronze frame", fact: "The Magna Carta was sealed in 1215, limiting royal power under law.", cue: "A heavy seal pressed into wet bronze.", decoys: ["Magna Carta was signed in 1776.", "It abolished all monarchy immediately.", "It was a French royal decree."] },
          { id: "g2", title: "Moon window", fact: "Apollo 11 landed the first humans on the Moon in 1969.", cue: "A silver boot print under a round window.", decoys: ["The first Moon landing was in 1959.", "Only robots reached the Moon before 1980.", "Apollo 11 never left Earth orbit."] },
          { id: "g3", title: "Wire portrait", fact: "The World Wide Web was proposed by Tim Berners-Lee in 1989.", cue: "A portrait sketched in glowing wire links.", decoys: ["The Web was invented at Xerox in 1972.", "Email and the Web are the same protocol.", "HTML was banned until 2001."] },
          { id: "g4", title: "Clock alcove", fact: "The fall of the Berlin Wall in 1989 became a symbol of the Cold War's end.", cue: "A cracked clock stopped at a midnight gate.", decoys: ["The Wall fell in 1945.", "It marked the start of World War II.", "Berlin remained fully divided until 2010."] },
          { id: "g5", title: "Ledger desk", fact: "Double-entry bookkeeping records every transaction as both debit and credit.", cue: "Two pens writing the same moment twice.", decoys: ["Only credits are recorded in double-entry.", "Ledgers ignore liabilities entirely.", "Cash basis is required for all companies."] }
        ]
      }
    ];

    const TONES = {
      dawn: { sky: "#24324a", hill: "#3d6d78", path: "#f0d7a2", glow: "#ffe7b8" },
      harbor: { sky: "#1a2c44", hill: "#2f5d72", path: "#d7e4c8", glow: "#c9efe8" },
      night: { sky: "#14182c", hill: "#2a3a62", path: "#c9b6ef", glow: "#efe6ff" }
    };

    const PAD = ["That belongs in another room.", "This was never sealed here.", "A different locus holds that."];
    const KEY = "memoryscape-v1";

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; }
    }
    function save(state) {
      localStorage.setItem(KEY, JSON.stringify({ bests: state.bests, customs: state.customs }));
    }

    const persisted = load();
    const state = {
      screen: "atlas",
      run: null,
      bests: persisted.bests || {},
      customs: persisted.customs || [],
      draft: { name: "", rows: [{ title: "", fact: "" }, { title: "", fact: "" }, { title: "", fact: "" }] }
    };

    function allPalaces() {
      return [...state.customs, ...PALACES];
    }
    function findPalace(id) {
      return allPalaces().find((p) => p.id === id) || PALACES[0];
    }
    function shuffle(items) {
      const next = [...items];
      for (let i = next.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [next[i], next[j]] = [next[j], next[i]];
      }
      return next;
    }
    function freshRun(palaceId) {
      return {
        palaceId,
        index: 0,
        score: 0,
        streak: 0,
        bestStreak: 0,
        sealed: [],
        missed: [],
        choices: [],
        picked: null,
        startedAt: Date.now()
      };
    }
    function buildCustom(name, rows) {
      const clean = rows.map((r) => ({ title: r.title.trim(), fact: r.fact.trim() })).filter((r) => r.title && r.fact);
      if (clean.length < 3) return null;
      const facts = clean.map((r) => r.fact);
      const tones = ["dawn", "harbor", "night"];
      return {
        id: "custom-" + Date.now(),
        name: name.trim() || "Untitled palace",
        subtitle: "Yours",
        tone: tones[Math.floor(Math.random() * tones.length)],
        loci: clean.map((row, i) => {
          const others = facts.filter((f) => f !== row.fact);
          return {
            id: "c" + i + "-" + row.title.slice(0, 12),
            title: row.title,
            fact: row.fact,
            cue: "The place you named " + row.title + ".",
            decoys: [...others, ...PAD].slice(0, 3)
          };
        })
      };
    }

    function sceneSVG(tone, seal, variant) {
      const t = TONES[tone] || TONES.dawn;
      const bend = -40 + (variant % 5) * 22;
      const path = `M${180 + bend} 430 C${170 - bend} 360 ${150 + bend} 320 ${168 - bend / 2} 270 C${190 + bend} 226 ${176 - bend} 190 180 150`;
      const stroke = seal === "sealed" ? "#2f7d57" : seal === "missed" ? "#b85c52" : "#5c9496";
      const sun = variant % 2 === 0;
      const mark = variant % 3;
      return `
        <svg viewBox="0 0 360 460" aria-hidden="true">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${t.sky}" />
              <stop offset="1" stop-color="#0c1624" />
            </linearGradient>
            <radialGradient id="glow" cx="50%" cy="28%" r="40%">
              <stop offset="0" stop-color="${t.glow}" stop-opacity="0.95" />
              <stop offset="1" stop-color="${t.glow}" stop-opacity="0" />
            </radialGradient>
            <clipPath id="arch"><path d="M40 430 V180 A140 140 0 0 1 320 180 V430 Z" /></clipPath>
          </defs>
          <g clip-path="url(#arch)">
            <rect width="360" height="460" fill="url(#sky)" />
            <ellipse cx="${180 + bend / 3}" cy="${110 + (variant % 3) * 10}" rx="150" ry="90" fill="url(#glow)" />
            ${sun
              ? `<circle cx="${120 + (variant % 4) * 30}" cy="150" r="16" fill="${t.glow}" />`
              : `<path d="M${200 + (variant % 3) * 20} 130 a14 14 0 1 0 18 8 a11 11 0 1 1 -18 -8" fill="${t.glow}" />`}
            <path d="M0 ${280 + (variant % 3) * 12} C80 240 120 300 ${180 + bend} 270 C250 236 300 250 360 ${210 - (variant % 2) * 20} V460 H0 Z" fill="${t.hill}" opacity="0.55" />
            <path d="M0 340 C90 300 140 360 200 330 C260 300 310 320 360 280 V460 H0 Z" fill="${t.hill}" />
            <path d="${path}" fill="none" stroke="${t.path}" stroke-width="14" stroke-linecap="round" />
            <path d="${path}" fill="none" stroke="#fff6df" stroke-width="3" stroke-linecap="round" opacity="0.7" />
            ${mark === 0 ? `<circle cx="168" cy="250" r="7" fill="${t.path}" />` : ""}
            ${mark === 1 ? `<path d="M160 258 L172 238 L184 258 Z" fill="${t.path}" />` : ""}
            ${mark === 2 ? `<path d="M166 262 C166 240 186 240 180 262 C174 248 166 248 166 262" fill="${t.path}" />` : ""}
          </g>
          <path d="M40 430 V180 A140 140 0 0 1 320 180 V430" fill="none" stroke="#e8eef4" stroke-opacity="0.85" stroke-width="8" />
          <path d="M28 438 V176 A152 152 0 0 1 332 176 V438" fill="none" stroke="${stroke}" stroke-width="2" opacity="0.9" />
        </svg>`;
    }

    function sealState(run, locusId) {
      if (run.sealed.includes(locusId)) return "sealed";
      if (run.missed.includes(locusId)) return "missed";
      return "open";
    }

    function render() {
      const app = document.getElementById("app");
      if (state.screen === "atlas") {
        app.innerHTML = `
          <header class="top">
            <div class="brand"><div class="arch" aria-hidden="true"></div><div class="wordmark">Memory<span>Scape</span></div></div>
            <div class="chip">Atlas</div>
          </header>
          <h1>Choose a palace</h1>
          <p class="lede">Each room holds one thing worth keeping. Walk the path, then seal the fact under pressure.</p>
          <div class="grid">
            <form class="form" id="draft-form">
              <label>Your palace</label>
              <input id="draft-name" placeholder="Palace name" value="${escapeAttr(state.draft.name)}" />
              ${state.draft.rows.map((row, i) => `
                <div class="row2">
                  <input data-row="${i}" data-field="title" placeholder="Room ${i + 1}" value="${escapeAttr(row.title)}" />
                  <input data-row="${i}" data-field="fact" placeholder="Fact to seal" value="${escapeAttr(row.fact)}" />
                </div>
              `).join("")}
              <button class="btn" type="submit">Seal a new palace</button>
            </form>
            ${allPalaces().map((p) => {
              const best = state.bests[p.id];
              const mine = p.id.startsWith("custom-");
              return `
                <button class="card" type="button" data-open="${p.id}">
                  <div class="card-art"><div class="scene">${sceneSVG(p.tone, "open", 0)}</div></div>
                  <div class="card-body">
                    <div class="card-title">${escapeHtml(p.name)}</div>
                    <div class="card-sub">${escapeHtml(p.subtitle)}</div>
                    <div class="card-meta"><span>${p.loci.length} loci</span><span class="best">${best != null ? "Best " + best : "Unwalked"}</span></div>
                    ${mine ? `<button class="remove" type="button" data-remove="${p.id}">Remove</button>` : ""}
                  </div>
                </button>`;
            }).join("")}
          </div>`;
        bindAtlas();
        return;
      }

      if (state.screen === "debrief" && state.run) {
        const palace = findPalace(state.run.palaceId);
        app.innerHTML = `
          <div class="debrief">
            <div class="brand" style="justify-content:center;margin-bottom:0.75rem"><div class="arch"></div><div class="wordmark">Memory<span>Scape</span></div></div>
            <h1>${escapeHtml(palace.name)}</h1>
            <p class="lede">Path complete.</p>
            <div class="score">${state.run.score}</div>
            <p class="lede">Sealed ${state.run.sealed.length} / ${palace.loci.length} \u00b7 Best streak ${state.run.bestStreak}</p>
            <div class="nav" style="justify-content:center;margin-top:1.25rem">
              <button class="btn" type="button" id="again">Walk again</button>
              <button class="btn ghost" type="button" id="to-atlas">Back to atlas</button>
            </div>
          </div>`;
        document.getElementById("again").onclick = () => {
          state.run = freshRun(palace.id);
          state.screen = "walk";
          render();
        };
        document.getElementById("to-atlas").onclick = () => {
          state.screen = "atlas";
          state.run = null;
          render();
        };
        return;
      }

      if (!state.run) {
        state.screen = "atlas";
        render();
        return;
      }

      const palace = findPalace(state.run.palaceId);
      const locus = palace.loci[state.run.index];
      const seal = sealState(state.run, locus.id);
      const progress = Math.round((state.run.sealed.length / palace.loci.length) * 100);

      app.innerHTML = `
        <div class="hud">
          <div class="brand">
            <button class="btn ghost sm" type="button" id="back">Atlas</button>
            <div>
              <div style="font-size:0.65rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint)">${escapeHtml(palace.name)}</div>
              <div class="font-display" style="font-size:1.15rem;color:var(--navy)">${escapeHtml(locus.title)}</div>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><div class="l">Score</div><div class="v">${state.run.score}</div></div>
            <div class="stat"><div class="l">Streak</div><div class="v">${state.run.streak}</div></div>
          </div>
        </div>
        <div class="rail"><i style="width:${progress}%"></i></div>
        <div class="walk-grid">
          <div class="stage">
            <div class="scene">${sceneSVG(palace.tone, seal, state.run.index)}</div>
            <p class="cue">${escapeHtml(locus.cue)}</p>
          </div>
          <div class="panel">
            ${state.screen === "walk" ? `
              <h2>Study this locus</h2>
              <p class="lede">${escapeHtml(locus.fact)}</p>
              <div class="path">
                ${palace.loci.map((l, i) => {
                  const s = sealState(state.run, l.id);
                  const cls = i === state.run.index ? "here" : s === "sealed" ? "sealed" : s === "missed" ? "missed" : "";
                  return `<button class="node ${cls}" type="button" data-jump="${i}">${i + 1}</button>`;
                }).join("")}
              </div>
              <div class="nav">
                <button class="btn ghost sm" type="button" id="prev">\u2190 Prev</button>
                <button class="btn ghost sm" type="button" id="next">Next \u2192</button>
                <button class="btn sm" type="button" id="recall">Seal this locus</button>
              </div>
              <p class="lede" style="font-size:0.8rem">Keys: A / D to move \u00b7 Enter to recall</p>
            ` : `
              <h2>What was sealed here?</h2>
              <p class="lede">${escapeHtml(locus.title)} \u00b7 ${escapeHtml(locus.cue)}</p>
              <div class="choices">
                ${state.run.choices.map((c) => {
                  let cls = "choice";
                  if (state.run.picked) {
                    if (c === locus.fact) cls += " correct";
                    else if (c === state.run.picked) cls += " wrong";
                  }
                  return `<button class="${cls}" type="button" data-choice="${escapeAttr(c)}" ${state.run.picked ? "disabled" : ""}>${escapeHtml(c)}</button>`;
                }).join("")}
              </div>
              ${state.run.picked ? `<button class="btn" type="button" id="continue">${state.run.index >= palace.loci.length - 1 ? "Finish path" : "Continue"}</button>` : ""}
            `}
          </div>
        </div>`;
      bindWalk();
    }

    function bindAtlas() {
      document.getElementById("draft-form").onsubmit = (e) => {
        e.preventDefault();
        const palace = buildCustom(state.draft.name, state.draft.rows);
        if (!palace) {
          alert("Add at least 3 rooms with titles and facts.");
          return;
        }
        state.customs = [palace, ...state.customs];
        state.draft = { name: "", rows: [{ title: "", fact: "" }, { title: "", fact: "" }, { title: "", fact: "" }] };
        save(state);
        render();
      };
      document.querySelectorAll("[data-field]").forEach((el) => {
        el.oninput = () => {
          const i = Number(el.getAttribute("data-row"));
          const field = el.getAttribute("data-field");
          state.draft.rows[i][field] = el.value;
        };
      });
      const name = document.getElementById("draft-name");
      if (name) name.oninput = () => { state.draft.name = name.value; };
      document.querySelectorAll("[data-open]").forEach((el) => {
        el.onclick = (e) => {
          if (e.target.closest("[data-remove]")) return;
          const id = el.getAttribute("data-open");
          state.run = freshRun(id);
          state.screen = "walk";
          render();
        };
      });
      document.querySelectorAll("[data-remove]").forEach((el) => {
        el.onclick = (e) => {
          e.stopPropagation();
          const id = el.getAttribute("data-remove");
          state.customs = state.customs.filter((p) => p.id !== id);
          save(state);
          render();
        };
      });
    }

    function bindWalk() {
      const back = document.getElementById("back");
      if (back) back.onclick = () => { state.screen = "atlas"; state.run = null; render(); };
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const recall = document.getElementById("recall");
      if (prev) prev.onclick = () => step(-1);
      if (next) next.onclick = () => step(1);
      if (recall) recall.onclick = () => beginRecall();
      document.querySelectorAll("[data-jump]").forEach((el) => {
        el.onclick = () => {
          state.run.index = Number(el.getAttribute("data-jump"));
          state.screen = "walk";
          render();
        };
      });
      document.querySelectorAll("[data-choice]").forEach((el) => {
        el.onclick = () => answer(el.getAttribute("data-choice"));
      });
      const cont = document.getElementById("continue");
      if (cont) cont.onclick = () => continueAfter();
    }

    function step(dir) {
      if (state.screen !== "walk" || !state.run) return;
      const count = findPalace(state.run.palaceId).loci.length;
      state.run.index = Math.min(count - 1, Math.max(0, state.run.index + dir));
      render();
    }
    function beginRecall() {
      const locus = findPalace(state.run.palaceId).loci[state.run.index];
      state.run.picked = null;
      state.run.choices = shuffle([locus.fact, ...locus.decoys]);
      state.screen = "recall";
      render();
    }
    function answer(choice) {
      if (!state.run || state.run.picked) return;
      const locus = findPalace(state.run.palaceId).loci[state.run.index];
      const correct = choice === locus.fact;
      state.run.picked = choice;
      if (correct) {
        state.run.score += 100 + state.run.streak * 25;
        state.run.streak += 1;
        state.run.bestStreak = Math.max(state.run.bestStreak, state.run.streak);
        if (!state.run.sealed.includes(locus.id)) state.run.sealed.push(locus.id);
        state.run.missed = state.run.missed.filter((id) => id !== locus.id);
      } else {
        state.run.streak = 0;
        if (!state.run.missed.includes(locus.id)) state.run.missed.push(locus.id);
      }
      render();
    }
    function continueAfter() {
      const palace = findPalace(state.run.palaceId);
      if (state.run.index >= palace.loci.length - 1) {
        const prev = state.bests[state.run.palaceId] || 0;
        state.bests[state.run.palaceId] = Math.max(prev, state.run.score);
        save(state);
        state.screen = "debrief";
        render();
        return;
      }
      state.run.index += 1;
      state.run.picked = null;
      state.run.choices = [];
      state.screen = "walk";
      render();
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escapeAttr(s) { return escapeHtml(s); }

    window.addEventListener("keydown", (e) => {
      if (state.screen !== "walk") return;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") step(1);
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") step(-1);
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        beginRecall();
      }
    });

    render();
  </script>
</body>
</html>
